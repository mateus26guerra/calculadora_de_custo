<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Horas de Trabalho</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Quanto tempo de trabalho custa?</h1>
      <p class="subtitulo">Descubra quantas horas você precisa trabalhar para comprar algo.</p>
    </header>

    <section class="card">
      <h2>1. Seu valor por hora</h2>
      <p class="formula">Hora de trabalho = Salário ÷ Dias trabalhados ÷ Horas por dia</p>

      <div class="campos">
        <label>
          Salário (R$)
          <input type="number" id="salario" value="2500" min="0" step="0.01">
        </label>
        <label>
          Dias trabalhados no mês
          <input type="number" id="dias" value="22" min="1" step="1">
        </label>
        <label>
          Horas por dia
          <input type="number" id="horas" value="8" min="1" step="0.5">
        </label>
      </div>

      <div class="resultado-hora">
        Sua hora vale <strong id="valorHora">R$ 0,00</strong>
      </div>
    </section>

    <section class="card">
      <h2>2. O que você quer comprar?</h2>

      <div class="campos campos-produto">
        <label>
          Nome do produto
          <input type="text" id="nomeProduto" placeholder="Ex: PS5">
        </label>
        <label>
          Preço (R$)
          <input type="number" id="precoProduto" placeholder="Ex: 3800" min="0" step="0.01">
        </label>
        <button type="button" id="adicionar">Adicionar</button>
      </div>

      <ul id="lista" class="lista"></ul>
      <p id="vazio" class="vazio">Adicione um ou mais produtos para comparar.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
